[project]
name = "videos-cut"
version = "0.1.0"
description = "Reproducible narration-led video editing with open-source components"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "moviepy==2.2.1",
  "pillow>=9.2,<12",
  "edge-tts>=7.2,<8",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2", "auto-editor>=29"]
download = ["yt-dlp[default,curl-cffi]==2026.10.21"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
videocut = "videocut.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videocut"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills/ffmpeg-skill/SKILL.md" = "videocut/_vendor/ffmpeg_skill/SKILL.md"
".agents/skills/ffmpeg-skill/LICENSE" = "videocut/_vendor/ffmpeg_skill/LICENSE"
".agents/skills/ffmpeg-skill/package.json" = "videocut/_vendor/ffmpeg_skill/package.json"
".agents/skills/ffmpeg-skill/scripts" = "videocut/_vendor/ffmpeg_skill/scripts"
".agents/skills/ffmpeg-skill/templates" = "videocut/_vendor/ffmpeg_skill/templates"
".agents/skills/ffmpeg-skill/references" = "videocut/_vendor/ffmpeg_skill/references"
".agents/skills/ffmpeg-skill/docs/contract.md" = "videocut/_vendor/ffmpeg_skill/docs/contract.md"
".agents/skills/ffmpeg-skill/docs/demos.md" = "videocut/_vendor/ffmpeg_skill/docs/demos.md"
".agents/skills/ffmpeg-skill/docs/design-decisions.md" = "videocut/_vendor/ffmpeg_skill/docs/design-decisions.md"
".agents/skills/ffmpeg-skill/docs/roadmap.md" = "videocut/_vendor/ffmpeg_skill/docs/roadmap.md"
".agents/skills/ffmpeg-skill/mcp" = "videocut/_vendor/ffmpeg_skill/mcp"

[tool.hatch.build.targets.sdist]
include = [
  "/videocut", "/tests", "/scripts", "/examples", "/docs", "/films",
  "/README.md", "/AGENTS.md", "/LICENSE", "/.gitmodules", "/pyproject.toml", "/uv.lock", "/requirements*.txt",
  "/skills",
  "/.agents/skills/ffmpeg-skill/SKILL.md", "/.agents/skills/ffmpeg-skill/LICENSE",
  "/.agents/skills/ffmpeg-skill/package.json", "/.agents/skills/ffmpeg-skill/scripts",
  "/.agents/skills/ffmpeg-skill/templates", "/.agents/skills/ffmpeg-skill/references",
  "/.agents/skills/ffmpeg-skill/docs/*.md", "/.agents/skills/ffmpeg-skill/mcp",
]
exclude = [
  "**/node_modules", "**/.venv", "**/.venv-*", "**/__pycache__",
  "/films/**/data", "/films/**/models/**/*.glb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Use the already installed system FFmpeg instead of downloading a second binary.
no-binary-package = ["imageio-ffmpeg"]

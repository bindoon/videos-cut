[project]
name = "videos-cut"
version = "0.1.0"
description = "Reproducible narration-led video editing with open-source components"
requires-python = ">=3.12,<3.14"
dependencies = [
  "moviepy==2.2.1",
  "edge-tts>=7.2,<8",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2", "auto-editor>=29"]
download = ["yt-dlp[default,curl-cffi]==2026.10.21"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
videocut = "videocut.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videocut"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Use the already installed system FFmpeg instead of downloading a second binary.
no-binary-package = ["imageio-ffmpeg"]

[project]
name = "videos-cut"
version = "0.1.0"
description = "Reproducible narration-led video editing with open-source components"
requires-python = ">=3.12,<3.14"
dependencies = [
  "moviepy==2.2.1",
  "pillow>=9.2,<12",
  "edge-tts>=7.2,<8",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2", "auto-editor>=29"]
download = ["yt-dlp[default,curl-cffi]==2026.10.21"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
videocut = "videocut.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videocut"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills/ffmpeg-skill" = "videocut/_vendor/ffmpeg_skill"

[tool.hatch.build.targets.sdist]
include = [
  "/videocut", "/tests", "/scripts", "/examples", "/docs", "/films",
  "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/requirements*.txt",
  "/.agents/skills/ffmpeg-skill", "/.agents/skills/xiaohongshu-quotes",
]
exclude = [
  "**/node_modules", "**/.venv", "**/.venv-*", "**/__pycache__",
  "/films/**/data", "/films/**/models/**/*.glb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Use the already installed system FFmpeg instead of downloading a second binary.
no-binary-package = ["imageio-ffmpeg"]
